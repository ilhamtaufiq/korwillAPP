<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daftar User | KorwilAPP</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { theme: { extend: {
  colors: {
    primary: '#059669', 'primary-hover': '#047857', 'primary-soft': '#ECFDF5',
    canvas: '#F8FAFC', muted: '#F1F5F9', line: '#E2E8F0',
    ink: '#0F172A', ink2: '#334155', ink3: '#64748B',
    danger: '#B91C1C', 'danger-soft': '#FEF2F2', 'danger-line': '#FCA5A5',
    warn: '#B45309', 'warn-soft': '#FFFBEB', 'warn-line': '#FCD34D',
  },
  fontFamily: { sans: ['Inter', 'sans-serif'] },
} } };
</script>
<script src="/app.js"></script>
<script src="/layout.js"></script>
</head>
<body class="bg-canvas font-sans text-ink min-h-screen">

<main class="mx-auto max-w-5xl px-4 py-6">
  <div id="error-message" class="mb-4 hidden rounded-lg border border-danger-line bg-danger-soft px-3 py-2 text-sm text-danger"></div>
  <div id="success-message" class="mb-4 hidden rounded-lg border border-primary bg-primary-soft px-3 py-2 text-sm text-primary"></div>

  <div class="mb-4 flex flex-col gap-3 md:flex-row md:items-end md:justify-between">
    <div class="flex flex-col gap-1">
      <h1 class="text-xl font-bold">Daftar User</h1>
      <p class="text-sm text-ink3">Akun admin, korwil, dan TFL yang terdaftar di sistem.</p>
    </div>
    <button id="btn-tambah" type="button" class="h-11 rounded-lg bg-primary px-4 font-semibold text-white hover:bg-primary-hover">Tambah User</button>
  </div>

  <section id="user-form" hidden class="mb-6 rounded-lg border border-line bg-white p-4">
    <h2 id="form-title" class="mb-4 font-semibold"></h2>
    <form id="form-user" class="grid gap-4 sm:grid-cols-2">
      <div class="flex flex-col gap-1.5">
        <label class="text-sm font-semibold text-ink2" for="f-username">Username</label>
        <input id="f-username" required minlength="3" maxlength="64" pattern="[A-Za-z0-9._\-]+"
          class="h-11 rounded-lg border border-line bg-white px-4 text-sm focus:border-[1.5px] focus:border-primary focus:outline-none disabled:bg-muted disabled:text-ink3">
        <span class="text-xs text-ink3">Huruf, angka, titik, garis bawah, atau strip.</span>
      </div>
      <div id="wrap-nama" class="flex flex-col gap-1.5">
        <label class="text-sm font-semibold text-ink2" for="f-nama">Nama lengkap</label>
        <input id="f-nama" maxlength="255" class="h-11 rounded-lg border border-line bg-white px-4 text-sm focus:border-[1.5px] focus:border-primary focus:outline-none">
      </div>
      <div id="wrap-role" class="flex flex-col gap-1.5">
        <label class="text-sm font-semibold text-ink2" for="f-role">Peran</label>
        <select id="f-role" class="h-11 rounded-lg border border-line bg-white px-3 text-sm focus:border-[1.5px] focus:border-primary focus:outline-none">
          <option value="tfl">TFL</option>
          <option value="korwil">Korwil</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <div id="wrap-password" class="flex flex-col gap-1.5">
        <label class="text-sm font-semibold text-ink2" for="f-password">Kata sandi</label>
        <input id="f-password" type="password" autocomplete="new-password" minlength="8"
          class="h-11 rounded-lg border border-line bg-white px-4 text-sm focus:border-[1.5px] focus:border-primary focus:outline-none">
        <span class="text-xs text-ink3">Minimal 8 karakter. User diminta menggantinya saat login.</span>
      </div>
      <div class="flex gap-2 sm:col-span-2 sm:justify-end">
        <button id="f-cancel" type="button" class="h-11 flex-1 rounded-lg border border-line font-semibold text-ink hover:bg-muted sm:flex-none sm:px-5">Batal</button>
        <button id="f-save" type="submit" class="h-11 flex-1 rounded-lg bg-primary font-semibold text-white hover:bg-primary-hover disabled:bg-muted disabled:text-ink3 sm:flex-none sm:px-5">Simpan</button>
      </div>
    </form>
  </section>

  <section id="users-section" hidden>
    <div class="mb-4 flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
      <input id="user-search" type="search" placeholder="Cari username atau nama..."
        class="h-11 w-full rounded-lg border border-line bg-white px-4 text-sm focus:border-[1.5px] focus:border-primary focus:outline-none md:w-72">
      <div class="flex flex-wrap gap-2 text-xs font-semibold">
        <button data-role="" class="role-chip h-9 rounded-lg bg-primary px-3 text-white">Semua</button>
        <button data-role="admin" class="role-chip h-9 rounded-lg bg-muted px-3 text-ink2">Admin</button>
        <button data-role="korwil" class="role-chip h-9 rounded-lg bg-muted px-3 text-ink2">Korwil</button>
        <button data-role="tfl" class="role-chip h-9 rounded-lg bg-muted px-3 text-ink2">TFL</button>
      </div>
    </div>

    <div class="overflow-hidden rounded-lg border border-line bg-white">
      <div class="overflow-x-auto">
        <table class="w-full min-w-[760px] text-left text-sm">
          <thead class="bg-muted text-xs font-semibold text-ink2">
            <tr>
              <th class="px-4 py-2">Username</th>
              <th class="px-4 py-2">Nama</th>
              <th class="px-4 py-2">Peran</th>
              <th class="px-4 py-2 text-center">Pekerjaan</th>
              <th class="px-4 py-2">Kata Sandi</th>
              <th class="px-4 py-2 text-right">Aksi</th>
            </tr>
          </thead>
          <tbody id="user-rows" class="divide-y divide-line"></tbody>
        </table>
      </div>
      <p id="user-count" class="border-t border-line px-4 py-3 text-xs text-ink3"></p>
    </div>
  </section>
</main>

<script>
const errorBox = document.getElementById('error-message');
const successBox = document.getElementById('success-message');
const PERAN = { admin: 'Admin', korwil: 'Korwil', tfl: 'TFL' };
const PERAN_CLASS = {
  admin: 'border-primary bg-primary-soft text-primary',
  korwil: 'border-line bg-muted text-ink2',
  tfl: 'border-line bg-white text-ink2',
};
let semuaUser = [];
let peranAktif = '';
let mode = 'create';
let editId = null;

function kataSandiBadge(u) {
  return u.must_change_password
    ? '<span class="inline-flex rounded-md border border-warn-line bg-warn-soft px-2 py-0.5 text-xs font-semibold text-warn">Belum diganti</span>'
    : '<span class="text-xs text-ink3">-</span>';
}

function rowHtml(u) {
  return `
    <tr class="hover:bg-muted">
      <td class="px-4 py-3 font-semibold">${esc(u.username)}</td>
      <td class="px-4 py-3 text-ink2">${u.nama ? esc(u.nama) : '<span class="text-ink3">-</span>'}</td>
      <td class="px-4 py-3">
        <span class="inline-flex rounded-md border px-2 py-0.5 text-xs font-semibold ${PERAN_CLASS[u.role] || ''}">${PERAN[u.role] || esc(u.role)}</span>
      </td>
      <td class="px-4 py-3 text-center font-semibold">${u.pekerjaan}</td>
      <td class="px-4 py-3">${kataSandiBadge(u)}</td>
      <td class="px-4 py-3">
        <div class="flex justify-end gap-1">
          <button type="button" data-act="edit" data-id="${u.id}" class="h-11 rounded-lg px-3 text-sm font-semibold text-ink2 hover:bg-muted">Ubah</button>
          <button type="button" data-act="reset" data-id="${u.id}" class="h-11 rounded-lg px-3 text-sm font-semibold text-primary hover:bg-primary-soft">Reset kata sandi</button>
        </div>
      </td>
    </tr>`;
}

function renderUsers() {
  const q = document.getElementById('user-search').value.trim().toLowerCase();
  const list = semuaUser.filter((u) =>
    (!peranAktif || u.role === peranAktif) &&
    (!q || `${u.username} ${u.nama || ''}`.toLowerCase().includes(q)));
  document.getElementById('user-rows').innerHTML = list.length
    ? list.map(rowHtml).join('')
    : '<tr><td colspan="6" class="px-4 py-6 text-center text-ink3">Tidak ada user yang cocok.</td></tr>';
  document.getElementById('user-count').textContent =
    `Menampilkan ${list.length} dari ${semuaUser.length} user`;
}

async function loadUsers() {
  semuaUser = await api('GET', '/api/users');
  renderUsers();
}

function setSuccess(message) {
  successBox.textContent = message;
  successBox.classList.remove('hidden');
  setTimeout(() => successBox.classList.add('hidden'), 4000);
}

// Form dipakai untuk tiga mode: tambah user, ubah nama dan peran, dan reset kata sandi.
function openForm(nextMode, user) {
  mode = nextMode;
  editId = user ? user.id : null;
  hideError(errorBox);

  const isCreate = mode === 'create';
  const isEdit = mode === 'edit';
  const isReset = mode === 'reset';
  document.getElementById('form-title').textContent =
    isCreate ? 'Tambah User' : isEdit ? `Ubah ${user.username}` : `Reset kata sandi ${user.username}`;

  const username = document.getElementById('f-username');
  username.value = isCreate ? '' : user.username;
  username.disabled = !isCreate;
  document.getElementById('wrap-nama').hidden = isReset;
  document.getElementById('wrap-role').hidden = isReset;
  document.getElementById('f-nama').value = isCreate || isReset ? '' : (user.nama || '');
  document.getElementById('f-role').value = isCreate ? 'tfl' : isEdit ? user.role : 'tfl';

  const password = document.getElementById('f-password');
  password.value = '';
  document.getElementById('wrap-password').hidden = isEdit;
  password.required = !isEdit;

  document.getElementById('user-form').hidden = false;
  document.getElementById('user-form').scrollIntoView({ behavior: 'smooth', block: 'start' });
  username.focus();
}

function closeForm() {
  document.getElementById('user-form').hidden = true;
  editId = null;
}

document.getElementById('btn-tambah').addEventListener('click', () => openForm('create'));
document.getElementById('f-cancel').addEventListener('click', closeForm);

document.getElementById('user-rows').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-act]');
  if (!btn) return;
  const user = semuaUser.find((u) => String(u.id) === btn.dataset.id);
  if (!user) return;
  openForm(btn.dataset.act, user);
});

document.getElementById('form-user').addEventListener('submit', async (e) => {
  e.preventDefault();
  hideError(errorBox);
  const save = document.getElementById('f-save');
  save.disabled = true;
  try {
    if (mode === 'create') {
      await api('POST', '/api/users', {
        username: document.getElementById('f-username').value.trim(),
        nama: document.getElementById('f-nama').value.trim(),
        role: document.getElementById('f-role').value,
        password: document.getElementById('f-password').value,
      });
      setSuccess('User baru berhasil ditambahkan. Ia diminta mengganti kata sandi saat login.');
    } else if (mode === 'edit') {
      await api('PUT', `/api/users/${editId}`, {
        nama: document.getElementById('f-nama').value.trim(),
        role: document.getElementById('f-role').value,
      });
      setSuccess('Data user berhasil diubah.');
    } else {
      await api('POST', `/api/users/${editId}/password`, {
        password: document.getElementById('f-password').value,
      });
      setSuccess('Kata sandi berhasil direset. User diminta menggantinya saat login.');
    }
    closeForm();
    await loadUsers();
  } catch (err) {
    showError(errorBox, err.message);
  } finally {
    save.disabled = false;
  }
});

document.querySelectorAll('.role-chip').forEach((btn) => {
  btn.addEventListener('click', () => {
    peranAktif = btn.dataset.role;
    document.querySelectorAll('.role-chip').forEach((b) => {
      const on = b === btn;
      b.classList.toggle('bg-primary', on);
      b.classList.toggle('text-white', on);
      b.classList.toggle('bg-muted', !on);
      b.classList.toggle('text-ink2', !on);
    });
    renderUsers();
  });
});
document.getElementById('user-search').addEventListener('input', renderUsers);

(async () => {
  try {
    const user = await requireAuth();
    if (user.role !== 'admin') {
      showError(errorBox, 'Hanya admin yang bisa melihat daftar user.');
      return;
    }
    document.getElementById('users-section').hidden = false;
    await loadUsers();
  } catch (err) {
    showError(errorBox, err.message);
  }
})();
</script>
</body>
</html>
