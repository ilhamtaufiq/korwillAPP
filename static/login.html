  </style><script src="/app.js?v=6"></script></head><body class="bg-canvas font-sans text-ink min-h-screen"><main class="grid min-h-screen md:grid-cols-2"><div class="relative hidden overflow-hidden md:block"><img src="/img/cover-login.webp" alt="" class="absolute inset-0 h-full w-full object-cover"></div><div class="flex items-center justify-center px-4 py-8 md:px-10"><div class="w-full max-w-sm"><img src="/img/cover-login.webp" alt="" class="mb-6 w-full rounded-xl md:hidden"><header class="mb-6 flex flex-col items-center text-center"><img src="/img/logo.png" alt="" class="mb-3 h-16 w-16"><h1 class="text-2xl font-bold">KorwilAPP</h1><p class="mt-1 text-sm text-ink2">Sistem Dokumentasi Lapangan Korwil dan FM</p></header><section class="rounded-xl border border-line bg-white p-6 shadow-sm"><h2 class="text-lg font-semibold">Masuk</h2><p class="mt-1 text-sm text-ink2">Gunakan username yang diberikan admin.</p><div id="error-message" class="mt-4 hidden rounded-lg border border-danger-line bg-danger-soft px-3 py-2 text-sm text-danger"></div><form id="login-form" class="mt-5 flex flex-col gap-4"><div class="flex flex-col gap-1.5"><label class="text-sm font-semibold text-ink2" for="username">Username</label><input id="username" name="username" type="text" autocomplete="username" required class="h-11 w-full rounded-lg border border-line bg-white px-4 text-base focus:border-[1.5px] focus:border-primary focus:outline-none"></div><div class="flex flex-col gap-1.5"><div class="flex items-center justify-between"><label class="text-sm font-semibold text-ink2" for="password">Kata sandi</label><button type="button" onclick="alert('Hubungi admin untuk reset kata sandi.')" class="text-xs font-semibold text-primary hover:underline">Lupa kata sandi?</button></div><input id="password" name="password" type="password" autocomplete="current-password" required class="h-11 w-full rounded-lg border border-line bg-white px-4 text-base focus:border-[1.5px] focus:border-primary focus:outline-none"></div><button id="submit-btn" type="submit" class="mt-1 h-11 w-full rounded-lg bg-primary font-semibold text-white hover:bg-primary-hover disabled:bg-muted disabled:text-ink3">Masuk ke Sistem</button></form></section></div></div></main><script>
const form = document.getElementById('login-form');
const errorBox = document.getElementById('error-message');
const submitBtn = document.getElementById('submit-btn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  hideError(errorBox);
  submitBtn.disabled = true;
  submitBtn.textContent = 'Memverifikasi...';
  try {
    await api('POST', '/api/login', {
      username: document.getElementById('username').value.trim(),
      password: document.getElementById('password').value,
    });
    location.href = '/';
  } catch (_) {
    showError(errorBox, 'Username atau kata sandi tidak valid.');
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Masuk ke Sistem';
  }
});
</script></body></html>
