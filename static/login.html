<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masuk | KorwilAPP</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<style>
  .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-weight: normal; font-style: normal; font-size: 20px; line-height: 1; display: inline-block; font-feature-settings: 'liga'; -webkit-font-smoothing: antialiased; }
</style>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { theme: { extend: {
  colors: {
    primary: '#059669', 'primary-hover': '#047857', 'primary-soft': '#ECFDF5',
    canvas: '#F8FAFC', muted: '#F1F5F9', line: '#E2E8F0',
    ink: '#0F172A', ink2: '#334155', ink3: '#64748B',
    danger: '#B91C1C', 'danger-soft': '#FEF2F2', 'danger-line': '#FCA5A5',
  },
  fontFamily: { sans: ['Inter', 'sans-serif'] },
} } };
</script>
<script src="/app.js"></script>
</head>
<body class="bg-canvas font-sans text-ink min-h-screen">
<main class="mx-auto flex w-full max-w-sm flex-col px-4 py-10">
  <header class="mb-6 flex flex-col items-center text-center">
    <div class="mb-3 flex h-12 w-12 items-center justify-center rounded-full bg-primary-soft text-primary font-bold">K</div>
    <h1 class="text-2xl font-bold">KorwilAPP</h1>
    <p class="mt-1 text-sm text-ink2">Sistem Dokumentasi Lapangan Korwil dan FM</p>
  </header>

  <section class="rounded-lg border border-line bg-white p-4">
    <h2 class="text-lg font-semibold">Masuk</h2>
    <p class="mt-1 text-sm text-ink2">Masukkan username dan kata sandi Anda.</p>

    <div id="error-message" class="mt-4 hidden rounded-lg border border-danger-line bg-danger-soft px-3 py-2 text-sm text-danger"></div>

    <form id="login-form" class="mt-4 flex flex-col gap-4">
      <div class="flex flex-col gap-1.5">
        <label class="text-sm font-semibold text-ink2" for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required
          class="h-11 w-full rounded-lg border border-line bg-white px-4 text-base focus:border-[1.5px] focus:border-primary focus:outline-none">
      </div>
      <div class="flex flex-col gap-1.5">
        <div class="flex items-center justify-between">
          <label class="text-sm font-semibold text-ink2" for="password">Kata sandi</label>
          <button type="button" onclick="alert('Hubungi admin untuk reset kata sandi.')" class="text-xs font-semibold text-primary hover:underline">Lupa kata sandi?</button>
        </div>
        <input id="password" name="password" type="password" autocomplete="current-password" required
          class="h-11 w-full rounded-lg border border-line bg-white px-4 text-base focus:border-[1.5px] focus:border-primary focus:outline-none">
      </div>
      <button id="submit-btn" type="submit"
        class="h-11 w-full rounded-lg bg-primary font-semibold text-white hover:bg-primary-hover disabled:bg-muted disabled:text-ink3">
        Masuk ke Sistem
      </button>
    </form>
  </section>

  <div class="mt-6 flex items-start gap-2.5 rounded-lg bg-muted p-3">
    <span class="material-symbols-outlined text-primary text-lg">cloud_sync</span>
    <div class="flex flex-col">
      <span class="text-xs font-semibold text-ink2">Mode Penugasan Lapangan</span>
      <span class="text-xs text-ink3">Data verifikasi fisik dan GPS dapat disinkronkan saat terhubung kembali ke jaringan.</span>
    </div>
  </div>
</main>

<script>
const form = document.getElementById('login-form');
const errorBox = document.getElementById('error-message');
const submitBtn = document.getElementById('submit-btn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  hideError(errorBox);
  submitBtn.disabled = true;
  submitBtn.textContent = 'Memverifikasi...';
  try {
    await api('POST', '/api/login', {
      username: document.getElementById('username').value.trim(),
      password: document.getElementById('password').value,
    });
    location.href = '/';
  } catch (_) {
    showError(errorBox, 'Username atau kata sandi tidak valid.');
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Masuk ke Sistem';
  }
});
</script>
</body>
</html>
