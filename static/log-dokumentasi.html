<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log Dokumentasi | KorwilAPP</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/app.css">
<script src="/app.js"></script>
<script src="/layout.js"></script>
</head>
<body class="bg-canvas font-sans text-ink min-h-screen">

<main class="mx-auto max-w-5xl px-4 py-6">
  <div id="error-message" class="mb-4 hidden rounded-lg border border-danger-line bg-danger-soft px-3 py-2 text-sm text-danger"></div>
  <div id="success-message" class="mb-4 hidden rounded-lg border border-primary bg-primary-soft px-3 py-2 text-sm text-primary"></div>

  <div class="mb-4 flex flex-col gap-1">
    <h1 class="text-xl font-bold">Log Dokumentasi</h1>
    <p class="text-sm text-ink3">Riwayat tambah, ubah, hapus, dan pulihkan data pekerjaan, pemanfaat, dan foto. Data yang dihapus bisa dikembalikan dari sini.</p>
  </div>

  <div class="overflow-x-auto rounded-lg border border-line bg-white">
    <table class="w-full min-w-[640px] text-sm">
      <thead class="bg-muted text-left text-xs uppercase tracking-wider text-ink3">
        <tr>
          <th class="px-3 py-2 font-semibold">Waktu</th>
          <th class="px-3 py-2 font-semibold">Oleh</th>
          <th class="px-3 py-2 font-semibold">Aksi</th>
          <th class="px-3 py-2 font-semibold">Keterangan</th>
          <th class="px-3 py-2"></th>
        </tr>
      </thead>
      <tbody id="log-body"></tbody>
    </table>
    <p id="log-kosong" class="hidden px-4 py-8 text-center text-sm text-ink3">Belum ada riwayat.</p>
  </div>

  <div class="mt-4 flex items-center justify-between gap-3">
    <span id="log-info" class="text-sm text-ink3"></span>
    <div class="flex gap-2">
      <button id="btn-prev" type="button" class="h-11 rounded-lg border border-line px-4 text-sm font-semibold text-ink2 hover:bg-muted disabled:opacity-50">Sebelumnya</button>
      <button id="btn-next" type="button" class="h-11 rounded-lg border border-line px-4 text-sm font-semibold text-ink2 hover:bg-muted disabled:opacity-50">Berikutnya</button>
    </div>
  </div>
</main>

<script>
const AKSI = {
  create: ['Dibuat', 'bg-primary-soft text-primary'],
  update: ['Diubah', 'bg-warn-soft text-warn'],
  delete: ['Dihapus', 'bg-danger-soft text-danger'],
  restore: ['Dipulihkan', 'bg-muted text-ink2'],
};
const ENTITAS = { pekerjaan: 'Pekerjaan', pemanfaat: 'Pemanfaat', foto: 'Foto' };
const PER_HALAMAN = 50;

const errorBox = document.getElementById('error-message');
const successBox = document.getElementById('success-message');
const logBody = document.getElementById('log-body');
let halaman = 1;
let totalHalaman = 1;

function baris(item) {
  const [label, cls] = AKSI[item.aksi] || [item.aksi, 'bg-muted text-ink2'];
  const entitas = ENTITAS[item.entitas] || item.entitas;
  // Pekerjaan yang sudah dihapus tidak bisa dibuka, jadi tautannya disembunyikan.
  const bisaBuka = item.project_id && !(item.entitas === 'pekerjaan' && item.terhapus);
  const tautan = bisaBuka
    ? `<a href="/detail-proyek.html?id=${item.project_id}" class="ml-1 text-xs font-semibold text-primary hover:underline">Buka pekerjaan</a>`
    : '';
  const pulihkan = item.terhapus
    ? `<button type="button" data-restore="${esc(item.entitas)}/${item.entitas_id}" class="h-9 rounded-lg border border-line px-3 text-sm font-semibold text-primary hover:bg-primary-soft">Pulihkan</button>`
    : '';
  return `<tr class="border-t border-line align-top">
    <td class="whitespace-nowrap px-3 py-2 text-ink3">${esc(item.waktu)}</td>
    <td class="px-3 py-2">${esc(item.username)}</td>
    <td class="px-3 py-2">
      <span class="rounded-full px-2 py-0.5 text-xs font-semibold ${cls}">${esc(label)}</span>
      <span class="ml-1 text-xs text-ink3">${esc(entitas)}</span>
    </td>
    <td class="px-3 py-2">${esc(item.keterangan)}${tautan}</td>
    <td class="px-3 py-2 text-right">${pulihkan}</td>
  </tr>`;
}

async function muat() {
  hideError(errorBox);
  logBody.innerHTML = skeletonRows(5, 8);
  try {
    const data = await api('GET', `/api/log?halaman=${halaman}`);
    totalHalaman = Math.max(1, Math.ceil(data.total / PER_HALAMAN));
    logBody.innerHTML = data.items.map(baris).join('');
    document.getElementById('log-kosong').classList.toggle('hidden', data.items.length > 0);
    document.getElementById('log-info').textContent =
      data.total === 0 ? '' : `Halaman ${halaman} dari ${totalHalaman} (${data.total} catatan)`;
    document.getElementById('btn-prev').disabled = halaman <= 1;
    document.getElementById('btn-next').disabled = halaman >= totalHalaman;
  } catch (err) {
    showError(errorBox, err.message);
  }
}

logBody.addEventListener('click', async (e) => {
  const btn = e.target.closest('[data-restore]');
  if (!btn) return;
  if (!confirm('Pulihkan data ini?')) return;
  hideError(errorBox);
  successBox.classList.add('hidden');
  btn.disabled = true;
  try {
    await api('POST', `/api/restore/${btn.dataset.restore}`);
    successBox.textContent = 'Data berhasil dipulihkan.';
    successBox.classList.remove('hidden');
    await muat();
  } catch (err) {
    showError(errorBox, err.message);
    btn.disabled = false;
  }
});

document.getElementById('btn-prev').addEventListener('click', () => {
  if (halaman > 1) { halaman -= 1; muat(); }
});
document.getElementById('btn-next').addEventListener('click', () => {
  if (halaman < totalHalaman) { halaman += 1; muat(); }
});

document.addEventListener('DOMContentLoaded', async () => {
  try {
    const user = await requireAuth();
    if (user.role !== 'admin') {
      location.href = '/';
      return;
    }
    muat();
  } catch (_) {}
});
</script>
</body>
</html>
